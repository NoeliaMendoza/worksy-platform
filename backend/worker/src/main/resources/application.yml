spring:
  application:
    name: screening-worker
  threads:
    virtual:
      enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:empleo}
    password: ${RABBITMQ_PASSWORD:}

# URL del servicio de inferencia. En F4 apuntará a Nginx para aplicar balanceo y canario.
inference:
  base-url: ${INFERENCE_URL:http://localhost:8000}

server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
