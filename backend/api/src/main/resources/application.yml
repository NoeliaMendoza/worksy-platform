spring:
  application:
    name: api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/empleo}
    username: ${DB_USER:empleo}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  # CV en PDF: máximo 5 MB (sección 5 del diseño). La petición admite un poco más por las cabeceras del multipart.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # Correo saliente (Gmail SMTP con contraseña de aplicación). Sin MAIL_HOST no se envían correos.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# Autenticación. VALORES SUPUESTOS (15 min / 7 días): confirmar con el diseño técnico.
worksy:
  auth:
    jwt-secret: ${JWT_SECRET:}
    issuer: worksy-api
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-cookie-secure: ${AUTH_COOKIE_SECURE:true}
    # VALOR SUPUESTO: confirmar con el diseño técnico.
    password-reset-ttl: 30m
    public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  # Proveedores externos: uno sin client-id queda desactivado.
  oauth:
    providers:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
      linkedin:
        client-id: ${LINKEDIN_CLIENT_ID:}
        client-secret: ${LINKEDIN_CLIENT_SECRET:}
      github:
        client-id: ${GITHUB_CLIENT_ID:}
        client-secret: ${GITHUB_CLIENT_SECRET:}
  mail:
    from: ${MAIL_FROM:}
  # Almacenamiento de CV compatible con S3 (MinIO). Usuario de servicio limitado al bucket, no el administrador.
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    # Dirección con la que el navegador abre los enlaces temporales de CV. Vacía = la misma que endpoint.
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET:cv-documents}

server:
  port: 8080
  # Detrás de un proxy (Vite en desarrollo, Nginx después) se usan X-Forwarded-* para construir URL públicas.
  forward-headers-strategy: framework
  # La sesión HTTP solo se usa durante la ida y vuelta al proveedor externo.
  servlet:
    session:
      timeout: 10m
      cookie:
        http-only: true
        same-site: lax
  shutdown: graceful
  tomcat:
    # Al rechazar un archivo grande, Tomcat descarta el resto del cuerpo para poder responder 413 con un
    # mensaje claro; con el valor por defecto (2 MB) cortaba la conexión. Acotado justo encima del multipart.
    max-swallow-size: 7MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Un fallo del SMTP no debe marcar la API como caída: el correo es secundario.
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
