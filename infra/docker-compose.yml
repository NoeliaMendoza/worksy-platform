# Plataforma de empleo: entorno local.
#
# Uso (desde la raíz del repositorio):
#   docker compose -f infra/docker-compose.yml --env-file .env up -d                 -> solo infraestructura
#   docker compose -f infra/docker-compose.yml --env-file .env --profile dev up -d   -> infraestructura + servicios
#
# El perfil "bench" (réplicas, Nginx, Prometheus, Grafana y k6) se agrega en la fase F4.
# Los puertos se publican solo en 127.0.0.1 para no exponerlos en la red local.

name: plataforma-empleo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?definir en .env}
      POSTGRES_USER: ${POSTGRES_USER:?definir en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?definir en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?definir en .env}
    ports:
      - "127.0.0.1:5672:5672"     # AMQP
      - "127.0.0.1:61613:61613"   # STOMP (broker relay del realtime-service)
      - "127.0.0.1:15672:15672"   # consola de administración
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?definir en .env}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: plataforma-empleo/minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?definir en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?definir en .env}
    ports:
      - "127.0.0.1:9000:9000"   # API S3
      - "127.0.0.1:9001:9001"   # consola
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Crea el bucket privado de CV y el usuario de servicio de la API (solo puede leer, escribir y
  # borrar objetos de ese bucket), y termina. Es idempotente: se puede ejecutar varias veces.
  minio-init:
    # Reutiliza la imagen de MinIO, que también incluye el cliente mc.
    image: plataforma-empleo/minio:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_CV: ${MINIO_BUCKET_CV:-cv-documents}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?definir en .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?definir en .env}
    volumes:
      - ./minio/cv-policy.json:/policy/cv-policy.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET_CV" &&
        mc anonymous set none "local/$$MINIO_BUCKET_CV" &&
        sed "s/BUCKET_CV/$$MINIO_BUCKET_CV/" /policy/cv-policy.json > /tmp/cv-policy.json &&
        mc admin policy create local worksy-cv /tmp/cv-policy.json &&
        mc admin user add local "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY" &&
        { mc admin policy attach local worksy-cv --user "$$STORAGE_ACCESS_KEY" ||
          mc admin user info local "$$STORAGE_ACCESS_KEY" | grep -q worksy-cv; } &&
        echo "bucket y usuario de servicio listos: $$MINIO_BUCKET_CV"
    restart: "no"

  # ---------------- Servicios de la aplicación (perfil dev) ----------------

  api:
    profiles: ["dev"]
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        MODULE: api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-}  # obligatorio (mínimo 32 caracteres); la API no arranca sin él
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      STORAGE_ENDPOINT: http://minio:9000
      # El navegador no conoce "minio": los enlaces temporales se firman con la dirección publicada.
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${MINIO_BUCKET_CV:-cv-documents}
      # Publica el outbox (screening.requested). Si RabbitMQ cae, la API sigue y los eventos esperan.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  screening-worker:
    profiles: ["dev"]
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        MODULE: worker
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      INFERENCE_URL: http://inference:8000
      # Misma base que la API (el esquema lo migra la API con Flyway).
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Lee los PDF con el mismo usuario de servicio limitado al bucket de CV.
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${MINIO_BUCKET_CV:-cv-documents}
    ports:
      - "127.0.0.1:${WORKER_HOST_PORT:-8081}:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
      inference:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # La API aplica las migraciones que usa el worker.
      api:
        condition: service_started

  realtime:
    profiles: ["dev"]
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        MODULE: realtime
    ports:
      - "127.0.0.1:${REALTIME_HOST_PORT:-8083}:8082"
    depends_on:
      rabbitmq:
        condition: service_healthy

  inference:
    profiles: ["dev"]
    build:
      context: ../inference
    ports:
      - "127.0.0.1:${INFERENCE_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  minio-data:
