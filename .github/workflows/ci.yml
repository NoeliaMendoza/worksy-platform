name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # MinIO ya no publica imágenes: las pruebas de CV usan la misma imagen compilada que Docker Compose.
      - name: Construir la imagen de MinIO para las pruebas
        working-directory: infra/minio
        run: docker build -t plataforma-empleo/minio:RELEASE.2025-10-15T17-29-55Z .
      - name: Compilar y probar (Testcontainers usa el Docker del runner)
        run: ./mvnw -B verify
      - name: Publicar reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/
      - name: Analizar con SonarQube Cloud
        if: >-
          ${{
            vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORGANIZATION != '' &&
            (github.event_name == 'push' ||
             (github.event.pull_request.head.repo.full_name == github.repository &&
              github.event.pull_request.base.ref == github.event.repository.default_branch &&
              github.actor != 'dependabot[bot]'))
          }}
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.java.jdkHome=${{ env.JAVA_HOME }}

  inference:
    name: Inferencia (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: inference/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m unittest discover -s ../scripts/evaluation -p "test_*.py" -v
      - run: python -m compileall -q ../scripts

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose:
    name: Validar docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.yml --env-file .env.example --profile dev config --quiet
      - run: docker compose -f scripts/compose.smoke.yml --profile tools --profile laya config --quiet
      - run: docker compose -f scripts/evaluation/compose.yml --profile tools --profile laya config --quiet
      - run: docker compose -f scripts/evaluation/compose.yml -f scripts/evaluation/compose.diagnostic.yml --profile tools --profile laya config --quiet
      - run: docker compose -f scripts/compose.smoke.yml -f scripts/compose.prebuilt.yml --profile tools --profile laya config --quiet
